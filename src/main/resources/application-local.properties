spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/monitoramento_espacial}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:monitoramento}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:monitoramento_local_password}

spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}

app.datasource.provider=${APP_DATASOURCE_PROVIDER:local-postgres}
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:local-development-jwt-secret-32-chars-minimum}
app.security.seed.admin.username=${APP_SECURITY_SEED_ADMIN_USERNAME:admin}
app.security.seed.admin.password=${APP_SECURITY_SEED_ADMIN_PASSWORD:admin_local_password}
app.security.seed.operador.username=${APP_SECURITY_SEED_OPERADOR_USERNAME:operador}
app.security.seed.operador.password=${APP_SECURITY_SEED_OPERADOR_PASSWORD:operador_local_password}
app.security.seed.analista.username=${APP_SECURITY_SEED_ANALISTA_USERNAME:analista}
app.security.seed.analista.password=${APP_SECURITY_SEED_ANALISTA_PASSWORD:analista_local_password}

simulator.api.enabled=${SIMULATOR_API_ENABLED:false}
simulator.api.url=${SIMULATOR_API_URL:http://localhost:8000}
